name: Neovim Startup Benchmark

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim
      - name: Run benchmark
        run: ./scripts/benchmark_nvim_startup.sh
      - name: Upload startup benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-startup-benchmark
          path: .cache/tino/nvim-startup/
          if-no-files-found: warn
  threshold-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify threshold guardrail path with stub Neovim
        run: pytest tests/test_setup_nvim.py::test_setup_nvim_uses_profile_default_threshold_when_enabled

