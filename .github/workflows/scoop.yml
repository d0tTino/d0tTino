name: publish-scoop
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Scoop manifest
        env:
          SCOOP_BUCKET: ${{ secrets.SCOOP_BUCKET }}
        run: |
          python -m pip install pyyaml
          python scripts/release.py --scoop
