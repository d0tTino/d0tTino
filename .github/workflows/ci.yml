name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.check.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-changed-code.sh

  tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify required schema tests
        run: |
          test -f tests/test_sources_schema.py
          test -f tests/test_plugin_registry_schema.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' pytest-cov jsonschema types-requests
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy --install-types --non-interactive
      - name: Install runtime requirements
        run: pip install -r requirements.txt jsonschema
      - name: Run tests
        run: pytest -n auto --cov=. --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
      - name: Verify awesome sources markdown
        run: pytest tests/test_generate_sources_md.py -q
      - name: Verify plugin registry
        run: python scripts/update_registry.py --check

  extras-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required schema tests
        run: |
          test -f tests/test_sources_schema.py
          test -f tests/test_plugin_registry_schema.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,lmql,guidance]' textual jsonschema
      - name: Install runtime requirements
        run: pip install -r requirements.txt jsonschema
      - name: Run tests with extras
        run: pytest -n auto
      - name: Verify plugin registry
        run: python scripts/update_registry.py --check
  install-dry-run:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Dry run install script
        run: |
          bash install.sh --dry-run | sed "s#${PWD}/##" > install_output.txt
          diff -u tests/expected/install_dry_run_${{ matrix.os }}.txt install_output.txt
          bash scripts/install_common.sh --dry-run
        shell: bash
