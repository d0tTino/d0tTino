add_newline = false
palette = "blacklight"
format = "[┌─](bold purple)$directory$git_branch$git_status$python$kubernetes$aws$status$fill$time\n[└─](bold purple)$character "

[palettes.blacklight]
black = "#000000"
red = "#ff66c4"
green = "#b2ff59"
yellow = "#ffff66"
blue = "#66b2ff"
purple = "#845CFF"
cyan = "#66fff2"
white = "#f2f2f2"
bright_black = "#666666"
bright_red = "#ff66c4"
bright_green = "#b2ff59"
bright_yellow = "#ffff66"
bright_blue = "#66b2ff"
bright_purple = "#FC17DA"
bright_cyan = "#66fff2"
bright_white = "#ffffff"

[directory]
style = "fg:bright_purple"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "fg:purple"

[git_status]
style = "fg:bright_purple"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = " "
format = '[$symbol($virtualenv )]($style)'
style = "fg:green"

[kubernetes]
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "fg:cyan"
disabled = false

[aws]
symbol = "󰸏 "
format = '[$symbol$profile( \($region\))]($style) '
style = "fg:yellow"

[time]
disabled = false
format = "[$time]($style) "
style = "fg:purple"

[status]
disabled = false
format = '[$symbol$status]($style) '
style = "fg:red"

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[package]
disabled = true
