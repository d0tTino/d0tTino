# Core behavior
set -g mouse on
set -g history-limit 100000
# Refresh status no faster than every 10s; heavy segments are cached in ~/.tmux_status_metrics.sh
set -g status-interval 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Theme (generated from metadata/palettes.json)
source-file ~/.tmux.palette.conf


# Ergonomic navigation and quality-of-life keybindings
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H swap-pane -L
bind -r L swap-pane -R
bind -r C-h previous-window
bind -r C-l next-window
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# TPM bootstrap + plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
